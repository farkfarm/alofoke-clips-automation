[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alofoke-clips"
version = "0.1.0"
description = "Local-first Spanish video highlight pipeline for authorized recordings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "python-dotenv>=1.0,<2", "psutil>=6,<8"]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
alofoke-clips = "alofoke_clips.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real FFmpeg/FFprobe tests (skip if unavailable)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebook imports intentionally follow dependency installation/interactive gates.
# Long literals include the temporary CLI instrumentation and user-facing guidance.
"notebooks/*.ipynb" = ["E402", "E501"]
